name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Build bundle, publish release and npm package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    services:
      gizmosql:
        image: gizmodata/gizmosql:v1.38.1
        env:
          TLS_ENABLED: "1"
          GIZMOSQL_USERNAME: gizmosql
          GIZMOSQL_PASSWORD: gizmosql_mcp_test_password
        ports:
          - 31337:31337
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:ci
      - run: npm test
      - run: npm run test:integration
        env:
          GIZMOSQL_TEST_HOST: localhost
          GIZMOSQL_TEST_PORT: "31337"
          GIZMOSQL_TEST_USERNAME: gizmosql
          GIZMOSQL_TEST_PASSWORD: gizmosql_mcp_test_password

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - run: npm run build:mcpb
      - run: npm pack

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG section found for $VERSION" > release_notes.md
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/*.mcpb
            build/*.mcpb.sha256
            *.tgz
          body_path: release_notes.md

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public
