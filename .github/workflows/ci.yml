name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:ci
      - run: npm test

  integration:
    name: Integration (GizmoSQL in Docker)
    runs-on: ubuntu-latest
    services:
      gizmosql:
        image: gizmodata/gizmosql:v1.38.1
        env:
          TLS_ENABLED: "1"
          GIZMOSQL_USERNAME: gizmosql
          GIZMOSQL_PASSWORD: gizmosql_mcp_test_password
        ports:
          - 31337:31337
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          GIZMOSQL_TEST_HOST: localhost
          GIZMOSQL_TEST_PORT: "31337"
          GIZMOSQL_TEST_USERNAME: gizmosql
          GIZMOSQL_TEST_PASSWORD: gizmosql_mcp_test_password

  bundle:
    name: Build .mcpb bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build:mcpb
      - uses: actions/upload-artifact@v7
        with:
          name: gizmosql-mcp-bundle
          path: |
            build/*.mcpb
            build/*.mcpb.sha256
          if-no-files-found: error

  image:
    name: Container image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: gizmosql-mcp:ci
      - name: Smoke test the image
        run: |
          docker run --rm gizmosql-mcp:ci --help
          docker run --rm --entrypoint node gizmosql-mcp:ci dist/cli.js --version

  chart:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/gizmosql-mcp
      - name: Render with OAuth and ingress enabled
        run: |
          helm template ci charts/gizmosql-mcp \
            --set config.GIZMOSQL_HOST=db.example.com \
            --set config.GIZMOSQL_MCP_PUBLIC_URL=https://mcp.example.com/mcp \
            --set config.GIZMOSQL_MCP_OAUTH_ISSUER=https://login.microsoftonline.com/tenant/v2.0 \
            --set config.GIZMOSQL_MCP_OAUTH_AUDIENCE=client-id \
            --set existingSecret=creds \
            --set ingress.enabled=true --set ingress.host=mcp.example.com > /dev/null
      - name: Chart version matches package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          CHART="$(sed -n 's/^version: *//p' charts/gizmosql-mcp/Chart.yaml)"
          [ "$CHART" = "$PKG" ] || { echo "chart $CHART != package $PKG" >&2; exit 1; }
